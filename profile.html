<!DOCTYPE html>
<html lang="ar" dir="rtl" id="html-root">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title id="page-title">ملف الموظف | Lacto Misr</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Cairo', sans-serif;
            background:
                linear-gradient(rgba(5, 11, 24, 0.86), rgba(5, 11, 24, 0.94)),
                url('background.jpg') no-repeat center center fixed;
            background-size: cover;
            color: #e2e8f0;
        }

        .glass-card {
            background: rgba(15, 23, 42, 0.76);
            backdrop-filter: blur(14px);
            border: 1px solid rgba(56, 189, 248, 0.2);
        }

        .neon {
            text-shadow:
                0 0 8px rgba(56,189,248,.55),
                0 0 18px rgba(14,165,233,.35);
        }

        .profile-photo {
            box-shadow:
                0 0 0 2px rgba(56,189,248,.25),
                0 0 30px rgba(14,165,233,.25);
        }

        .field-input {
            width: 100%;
            background: rgba(2, 6, 23, .78);
            border: 1px solid rgba(56, 189, 248, .25);
            border-radius: .65rem;
            padding: .65rem .8rem;
            color: #e2e8f0;
            outline: none;
        }

        .field-input:focus {
            border-color: rgba(56, 189, 248, .75);
            box-shadow: 0 0 0 2px rgba(14, 165, 233, .12);
        }

        .field-value {
            min-height: 42px;
            display: flex;
            align-items: center;
            padding: .55rem .75rem;
            border-radius: .65rem;
            background: rgba(2, 6, 23, .35);
            border: 1px solid rgba(56, 189, 248, .10);
            color: #f1f5f9;
        }

        .section-title {
            color: #7dd3fc;
            border-bottom: 1px solid rgba(56,189,248,.15);
        }
    </style>
</head>

<body class="min-h-screen">

<header class="glass-card shadow-lg px-5 md:px-8 py-4 flex justify-between items-center border-b">
    <div class="flex items-center gap-4">
        <button
            onclick="goBack()"
            class="px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 border border-sky-500/30 text-sky-300 text-sm transition">
            <span id="back-text">← رجوع</span>
        </button>

        <div>
            <div class="text-xl md:text-2xl font-bold text-sky-400 neon">⚡ Lacto Misr HR</div>
            <div class="text-xs text-slate-500" data-translate="profile_page">Employee Profile</div>
        </div>
    </div>

    <div class="flex items-center gap-3">
        <button
            onclick="toggleLanguage()"
            class="px-3 py-1.5 text-xs font-bold rounded bg-slate-800 hover:bg-slate-700 text-sky-300 border border-sky-500/40 transition">
            🌐 <span id="lang-btn-text">English</span>
        </button>

        <span
            id="profile-status"
            class="hidden md:inline-block text-xs px-3 py-1 rounded-full bg-sky-900/60 text-sky-300 border border-sky-500/30">
            --
        </span>
    </div>
</header>

<main class="max-w-7xl mx-auto p-5 md:p-8">

    <div id="loading-state" class="glass-card rounded-2xl p-12 text-center">
        <div class="text-sky-400 text-lg animate-pulse" data-translate="loading">
            جاري جلب بيانات الموظف...
        </div>
    </div>

    <div id="error-state" class="hidden glass-card rounded-2xl p-12 text-center">
        <div id="error-message" class="text-red-400 text-lg mb-5"></div>
        <button
            onclick="goBack()"
            class="px-5 py-2 rounded-lg bg-sky-600/40 hover:bg-sky-600 border border-sky-400/30 text-sky-100 transition">
            <span data-translate="back">العودة</span>
        </button>
    </div>

    <section id="profile-content" class="hidden">

        <div class="glass-card rounded-2xl p-6 md:p-8 mb-6">
            <div class="flex flex-col md:flex-row items-center gap-7">

                <div class="relative shrink-0">
                    <img
                        id="employee-photo"
                        src=""
                        alt="Employee"
                        class="profile-photo w-36 h-36 md:w-44 md:h-44 rounded-full object-cover bg-slate-900 border-2 border-sky-400/40">

                    <label
                        id="photo-edit-button"
                        class="hidden absolute bottom-1 right-1 cursor-pointer w-10 h-10 rounded-full bg-sky-600 hover:bg-sky-500 border-2 border-slate-950 flex items-center justify-center text-white shadow-lg"
                        title="Change photo">
                        📷
                        <input id="photo-input" type="file" accept="image/*" class="hidden">
                    </label>
                </div>

                <div class="text-center md:text-right flex-1">
                    <div class="text-xs uppercase tracking-widest text-sky-400 mb-2" data-translate="employee_code">
                        Employee Code
                    </div>

                    <h1 id="employee-name" class="text-3xl md:text-4xl font-bold text-white neon">
                        --
                    </h1>

                    <p id="employee-job" class="text-lg text-sky-300 mt-2">--</p>
                    <p id="employee-department" class="text-sm text-slate-400 mt-1">--</p>

                    <div class="flex flex-wrap justify-center md:justify-start gap-2 mt-4">
                        <span id="employee-code-badge" class="px-3 py-1 rounded-full bg-sky-950/80 border border-sky-500/30 text-sky-300 font-mono text-xs">
                            CODE: --
                        </span>

                        <span id="insurance-badge" class="px-3 py-1 rounded-full bg-emerald-950/50 border border-emerald-500/30 text-emerald-300 text-xs">
                            --
                        </span>
                    </div>
                </div>

                <div class="flex md:flex-col gap-2">
                    <button
                        id="edit-button"
                        onclick="enableEditMode()"
                        class="px-5 py-2.5 rounded-lg bg-sky-600/40 hover:bg-sky-600 border border-sky-400/30 text-sky-100 transition font-semibold">
                        ✏️ <span data-translate="edit">تعديل البيانات</span>
                    </button>

                    <button
                        id="save-button"
                        onclick="saveEmployee()"
                        class="hidden px-5 py-2.5 rounded-lg bg-emerald-600/40 hover:bg-emerald-600 border border-emerald-400/30 text-emerald-100 transition font-semibold">
                        💾 <span data-translate="save">حفظ التعديلات</span>
                    </button>

                    <button
                        id="cancel-button"
                        onclick="cancelEdit()"
                        class="hidden px-5 py-2.5 rounded-lg bg-slate-700/70 hover:bg-slate-700 border border-slate-500/30 text-slate-200 transition">
                        ✖ <span data-translate="cancel">إلغاء</span>
                    </button>
                </div>

            </div>
        </div>

        <div class="glass-card rounded-2xl p-6 md:p-8 mb-6">
            <h2 class="section-title text-lg font-bold pb-3 mb-5" data-translate="personal_info">
                البيانات الأساسية
            </h2>

            <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-5">

                <div>
                    <label class="text-xs text-slate-400" data-translate="name_ar">الاسم بالعربية</label>
                    <div id="field-name-ar" class="field-value mt-2"></div>
                </div>

                <div>
                    <label class="text-xs text-slate-400" data-translate="name_en">Name in English</label>
                    <div id="field-name-en" class="field-value mt-2"></div>
                </div>

                <div>
                    <label class="text-xs text-slate-400" data-translate="code">الكود</label>
                    <div id="field-code" class="field-value mt-2 font-mono text-sky-300"></div>
                </div>

                <div>
                    <label class="text-xs text-slate-400" data-translate="dob">تاريخ الميلاد</label>
                    <div id="field-dob" class="field-value mt-2"></div>
                </div>

                <div>
                    <label class="text-xs text-slate-400" data-translate="age">السن</label>
                    <div id="field-age" class="field-value mt-2"></div>
                </div>

                <div>
                    <label class="text-xs text-slate-400" data-translate="pob">محل الميلاد</label>
                    <div id="field-pob" class="field-value mt-2"></div>
                </div>

            </div>
        </div>

        <div class="glass-card rounded-2xl p-6 md:p-8 mb-6">
            <h2 class="section-title text-lg font-bold pb-3 mb-5" data-translate="job_info">
                البيانات الوظيفية
            </h2>

            <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-5">

                <div>
                    <label class="text-xs text-slate-400" data-translate="department_ar">الإدارة بالعربية</label>
                    <div id="field-department-ar" class="field-value mt-2"></div>
                </div>

                <div>
                    <label class="text-xs text-slate-400" data-translate="department_en">Department</label>
                    <div id="field-department-en" class="field-value mt-2"></div>
                </div>

                <div>
                    <label class="text-xs text-slate-400" data-translate="job_ar">الوظيفة بالعربية</label>
                    <div id="field-job-ar" class="field-value mt-2"></div>
                </div>

                <div>
                    <label class="text-xs text-slate-400" data-translate="job_en">Job Title</label>
                    <div id="field-job-en" class="field-value mt-2"></div>
                </div>

                <div>
                    <label class="text-xs text-slate-400" data-translate="manager_ar">المدير المباشر بالعربية</label>
                    <div id="field-manager-ar" class="field-value mt-2"></div>
                </div>

                <div>
                    <label class="text-xs text-slate-400" data-translate="manager_en">Direct Manager</label>
                    <div id="field-manager-en" class="field-value mt-2"></div>
                </div>

                <div>
                    <label class="text-xs text-slate-400" data-translate="hire_date">تاريخ التعيين</label>
                    <div id="field-hire-date" class="field-value mt-2"></div>
                </div>

                <div>
                    <label class="text-xs text-slate-400" data-translate="years_service">سنوات الخدمة</label>
                    <div id="field-years-service" class="field-value mt-2"></div>
                </div>

                <div>
                    <label class="text-xs text-slate-400" data-translate="insurance">الحالة التأمينية</label>
                    <div id="field-insurance" class="field-value mt-2"></div>
                </div>

            </div>
        </div>

        <div class="glass-card rounded-2xl p-6 md:p-8">
            <h2 class="section-title text-lg font-bold pb-3 mb-5" data-translate="qualification_info">
                المؤهل
            </h2>

            <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-5">

                <div>
                    <label class="text-xs text-slate-400" data-translate="qualification_ar">المؤهل بالعربية</label>
                    <div id="field-qualification-ar" class="field-value mt-2"></div>
                </div>

                <div>
                    <label class="text-xs text-slate-400" data-translate="qualification_en">Qualification</label>
                    <div id="field-qualification-en" class="field-value mt-2"></div>
                </div>

                <div>
                    <label class="text-xs text-slate-400" data-translate="qualification_year">سنة المؤهل</label>
                    <div id="field-qualification-year" class="field-value mt-2"></div>
                </div>

                <div>
                    <label class="text-xs text-slate-400" data-translate="issuing_authority_ar">جهة إصدار المؤهل</label>
                    <div id="field-issuing-authority-ar" class="field-value mt-2"></div>
                </div>

                <div>
                    <label class="text-xs text-slate-400" data-translate="issuing_authority_en">Qualification Issuing Authority</label>
                    <div id="field-issuing-authority-en" class="field-value mt-2"></div>
                </div>

            </div>
        </div>

    </section>
</main>

<script type="module" src="profile.js"></script>
</body>
</html>
