<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بوابة الشركة المركزية - Portal</title>
    <!-- استدعاء خط Cairo -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome للأيقونات -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- كود الـ CSS بالكامل هنا -->
    <style>
        :root {
            --primary-color: #2c3e50;
            --accent-color: #3498db;
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #e0e0e0;
            --border-color: #333333;
            --input-bg: #2a2a2a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
        }

        /* صفحة الانترو الخاصة بالـ Portal */
        #portal-intro {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #1a252f 0%, #121212 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.8s ease, visibility 0.8s ease;
        }

        #portal-intro.fade-out {
            opacity: 0;
            visibility: hidden;
        }

        .intro-logo-container {
            width: 150px;
            height: 150px;
            margin-bottom: 25px;
            animation: pulseIntro 2s infinite ease-in-out;
        }

        .intro-logo-container img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            filter: drop-shadow(0 0 15px rgba(52, 152, 219, 0.5));
        }

        .intro-title {
            font-size: 2.5rem;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 10px;
            text-align: center;
            letter-spacing: 1px;
        }

        .intro-subtitle {
            font-size: 1.1rem;
            color: var(--accent-color);
            text-align: center;
            margin-bottom: 30px;
        }

        .intro-loader {
            width: 200px;
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            overflow: hidden;
            position: relative;
        }

        .intro-loader::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            width: 50%;
            background: var(--accent-color);
            border-radius: 2px;
            animation: loadingProgress 1.5s infinite ease-in-out;
        }

        @keyframes pulseIntro {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        @keyframes loadingProgress {
            0% { left: -50%; }
            100% { left: 100%; }
        }

        /* زرار اللغة */
        .lang-switch-btn {
            position: absolute;
            top: 25px;
            left: 25px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s ease;
            z-index: 100;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }

        .lang-switch-btn:hover {
            background: var(--accent-color);
            color: #fff;
            border-color: var(--accent-color);
        }

        /* تصميم الشاشة المقسومة نصفين */
        .login-wrapper {
            display: flex;
            width: 900px;
            max-width: 90%;
            height: 520px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            overflow: hidden;
            position: relative;
        }

        /* الجزء الأيمن: خانات تسجيل الدخول */
        .login-form-section {
            flex: 1;
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .login-form-section h2 {
            margin-bottom: 8px;
            font-size: 1.8rem;
            color: #fff;
        }

        .login-form-section p {
            color: #888;
            font-size: 0.9rem;
            margin-bottom: 25px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.85rem;
            color: #aaa;
        }

        .input-group input {
            width: 100%;
            padding: 12px 15px;
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-color);
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s;
        }

        .input-group input:focus {
            border-color: var(--accent-color);
        }

        .submit-btn {
            width: 100%;
            padding: 12px;
            background: var(--accent-color);
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.3s;
        }

        .submit-btn:hover {
            background: #2980b9;
        }

        /* الجزء الأيسر: اللوجو الشقي */
        .login-brand-section {
            flex: 1;
            background: linear-gradient(145deg, #1f2937, #111827);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px;
            text-align: center;
            border-right: 1px solid var(--border-color);
        }

        html[lang="en"] .login-wrapper {
            direction: ltr;
        }

        .spinning-logo {
            width: 110px;
            height: 110px;
            margin-bottom: 20px;
            animation: spinLogo 12s linear infinite;
        }

        .spinning-logo img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        @keyframes spinLogo {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .brand-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: #fff;
            margin-bottom: 5px;
        }

        .brand-slogan {
            font-size: 0.85rem;
            color: #9ca3af;
        }
    </style>
</head>
<body>

    <!-- صفحة الانترو للـ Portal -->
    <div id="portal-intro">
        <div class="intro-logo-container">
            <img src="logo.png" alt="Company Logo">
        </div>
        <div class="intro-title" id="intro-title-text">بوابة الشركة المركزية</div>
        <div class="intro-subtitle" id="intro-subtitle-text">جاري تحميل النظام الإداري المتكامل...</div>
        <div class="intro-loader"></div>
    </div>

    <!-- زرار تغيير اللغة -->
    <button class="lang-switch-btn" id="langToggleBtn" onclick="toggleLanguage()">
        <i class="fa-solid fa-globe"></i> <span id="langText">English</span>
    </button>

    <!-- شاشة تسجيل الدخول مقسومة نصفين -->
    <div class="login-wrapper">
        <!-- الجزء الأيسر (اللوجو الشقي + اسم الشركة والسلوجن) -->
        <div class="login-brand-section">
            <div class="spinning-logo">
                <img src="logo.png" alt="Spinning Logo">
            </div>
            <div class="brand-title" id="brandTitleText">بوابة الشركة المركزية</div>
            <div class="brand-slogan" id="brandSloganText">نظام الإدارة والتحكم الشامل</div>
        </div>

        <!-- الجزء الأيمن (خانات تسجيل الدخول) -->
        <div class="login-form-section">
            <h2 id="loginHeader">تسجيل الدخول</h2>
            <p id="loginSubText">أدخل بيانات الحساب الخاصة بك للمتابعة</p>
            
            <form onsubmit="event.preventDefault();">
                <div class="input-group">
                    <label id="labelUser">اسم المستخدم / البريد الإلكتروني</label>
                    <input type="text" id="userInput" placeholder="name@company.com">
                </div>
                <div class="input-group">
                    <label id="labelPass">كلمة المرور</label>
                    <input type="password" id="passInput" placeholder="••••••••">
                </div>
                <button type="submit" class="submit-btn" id="submitBtnText">تسجيل الدخول</button>
            </form>
        </div>
    </div>

    <!-- ربط ملف الـ JavaScript الخارجي -->
    <script src="script.js"></script>
</body>
</html>
