<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lacto Misr ESS Portal</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* --- تنسيقات قائمة اختيار اللغة --- */
        .lang-dropdown-container {
            position: relative;
            display: inline-block;
        }

        .lang-dropdown-menu {
            display: none;
            position: absolute;
            top: 100%;
            right: 0;
            background-color: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.7);
            z-index: 100;
            min-width: 110px;
            margin-top: 5px;
        }

        .lang-dropdown-menu.show {
            display: block !important;
        }

        .lang-option {
            padding: 8px 14px;
            cursor: pointer;
            color: #e2e8f0;
            font-size: 13px;
            transition: background 0.2s;
            text-align: right;
        }

        .lang-option:hover {
            background-color: #1e293b;
            color: #38bdf8;
        }

        /* --- تنسيق شاشة الانترو والتلاشي الآمنة --- */
        #intro-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0b0f19;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 99999;
            transition: opacity 0.6s ease, visibility 0.6s ease;
            cursor: pointer;
        }

        #intro-screen.fade-out {
            opacity: 0;
            visibility: hidden;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans">

    <!-- 1. شاشة الإنترو -->
    <div id="intro-screen" onclick="dismissIntro()" title="اضغط لتخطي الشاشة">
        <div class="text-center">
            <div class="text-6xl mb-4">🏢</div>
            <h1 class="text-3xl font-bold text-sky-400 mb-2">LACTO MISR S.A.E</h1>
            <p class="text-slate-400" data-translate="loading">شركاء فى رحلة نمو طفلك...</p>
        </div>
    </div>

    <!-- 2. الهيدر العلوى وقائمة اللغات -->
    <header class="bg-slate-900 border-b border-slate-800 px-6 py-4 flex justify-between items-center shadow-lg">
        <div class="flex items-center gap-4">
            <div class="lang-dropdown-container">
                <button class="flex items-center gap-1.5 px-3 py-1.5 bg-slate-800 text-white rounded-lg text-sm border border-slate-700 hover:border-sky-500 transition shadow" onclick="toggleLangMenu(event)">
                    🌐 <span id="current-lang-short">AR</span> ▼
                </button>
                <div class="lang-dropdown-menu" id="langMenu">
                    <div class="lang-option" onclick="selectLanguage('ar')">🇪🇬 AR</div>
                    <div class="lang-option" onclick="selectLanguage('en')">🇬🇧 EN</div>
                </div>
            </div>
            <span class="text-sm text-slate-300 font-medium" data-translate="admin">مسؤول النظام</span>
        </div>
        <div class="text-xl font-bold text-sky-400 tracking-wider">Lacto Misr HR</div>
    </header>

    <!-- 3. المحتوى الرئيسي -->
    <main class="p-6 max-w-7xl mx-auto">
        
        <!-- إحصائيات سريعة -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
            <div class="bg-slate-900/80 border border-slate-800 p-5 rounded-2xl shadow-xl">
                <p class="text-slate-400 text-sm mb-1" data-translate="total_emp">إجمالي العاملين</p>
                <h3 id="total-employees-count" class="text-3xl font-bold text-white">--</h3>
            </div>
            <div class="bg-slate-900/80 border border-slate-800 p-5 rounded-2xl shadow-xl">
                <p class="text-slate-400 text-sm mb-1" data-translate="active_depts">الإدارات النشطة</p>
                <h3 class="text-3xl font-bold text-sky-400">12</h3>
            </div>
            <div class="bg-slate-900/80 border border-slate-800 p-5 rounded-2xl shadow-xl">
                <p class="text-slate-400 text-sm mb-1" data-translate="system_status">حالة النظام</p>
                <h3 class="text-sm font-semibold text-emerald-400 mt-2" data-translate="connected">مستقر (متصل بـ Firebase)</h3>
            </div>
        </div>

        <!-- جدول الموظفين -->
        <div id="employees-list-view" class="bg-slate-900/60 border border-slate-800 rounded-2xl p-6 shadow-xl">
            <div class="flex flex-col md:flex-row justify-between items-center mb-6 gap-4">
                <h2 class="text-lg font-semibold text-white" data-translate="emp_list">قائمة العاملين بالقاعدة</h2>
                <input type="text" id="search-input" oninput="filterEmployees()" placeholder="بحث بالاسم أو الكود..." class="bg-slate-950 border border-slate-800 rounded-xl px-4 py-2 text-sm text-white focus:border-sky-500 focus:outline-none w-full md:w-80">
            </div>
            
            <div class="overflow-x-auto">
                <table class="w-full text-right border-collapse">
                    <thead>
                        <tr class="border-b border-slate-800 text-slate-400 text-xs uppercase tracking-wider">
                            <th class="p-3.5" data-translate="th_code">الكود</th>
                            <th class="p-3.5" data-translate="th_name">اسم الموظف</th>
                            <th class="p-3.5" data-translate="th_dept">الإدارة</th>
                            <th class="p-3.5" data-translate="th_job">الوظيفة</th>
                            <th class="p-3.5" data-translate="th_hire">تاريخ التعيين</th>
                            <th class="p-3.5 text-center" data-translate="th_actions">الإجراءات</th>
                        </tr>
                    </thead>
                    <tbody id="employees-table-body"></tbody>
                </table>
            </div>
        </div>

        <!-- ملف الموظف -->
        <div id="employee-profile-view" style="display: none;" class="bg-slate-900/60 border border-slate-800 rounded-2xl p-6 shadow-xl">
            <button onclick="backToEmployeesList()" class="mb-6 px-4 py-2 bg-slate-800 hover:bg-slate-700 text-sky-400 rounded-xl text-sm transition border border-slate-700" data-translate="back_btn">← العودة للقائمة</button>
            
            <div class="flex items-center gap-6 mb-8">
                <img id="profile-img" src="default-avatar.png" class="w-24 h-24 rounded-2xl object-cover border-2 border-sky-500/50 shadow-lg" alt="Profile">
                <div>
                    <h2 id="prof-name" class="text-2xl font-bold text-white mb-1">---</h2>
                    <p id="prof-job" class="text-sky-400 text-sm">---</p>
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <div>
                    <label class="block text-xs text-slate-400 mb-1" data-translate="th_code">الكود</label>
                    <input type="text" id="prof-code" disabled class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm text-slate-300">
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1" data-translate="th_dept">الإدارة</label>
                    <input type="text" id="prof-dept" disabled class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm text-slate-300">
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1" data-translate="manager_label">المدير المباشر</label>
                    <input type="text" id="prof-manager" disabled class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm text-slate-300">
                </div>
            </div>

            <div class="mt-8 flex gap-4">
                <button id="btn-edit" onclick="enableEditing()" class="px-6 py-2.5 bg-sky-600 hover:bg-sky-500 text-white rounded-xl text-sm font-semibold transition shadow-lg" data-translate="edit_btn">تعديل البيانات</button>
                <button id="btn-save" onclick="confirmSave()" class="hidden px-6 py-2.5 bg-emerald-600 hover:bg-emerald-500 text-white rounded-xl text-sm font-semibold transition shadow-lg" data-translate="save_btn">حفظ</button>
            </div>
        </div>

    </main>

    <!-- Toast Notification -->
    <div id="toast-notification" class="fixed bottom-6 right-6 transform translate-y-32 opacity-0 transition-all duration-300 bg-emerald-600 text-white px-6 py-3 rounded-xl shadow-2xl z-50">
        <span id="toast-message">تم بنجاح</span>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-analytics.js"></script>

    <!-- ربط ملف الـ JavaScript الخارجي -->
    <script src="script.js"></script>
</body>
</html>
